<!DOCTYPE html>
<html lang="en">
<head>
    <title>Add Task</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * { font-family: 'Poppins', sans-serif; }
        body { margin:0; min-height:100vh; background: url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?ixlib=rb-4.0.3&auto=format&fit=crop&w=1650&q=80') center/cover no-repeat fixed; color:#eef3ff; }
        body::before { content:''; position:fixed; inset:0; background:rgba(4, 12, 30, 0.78); z-index:0; }
        .page-shell { position:relative; z-index:1; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:40px 20px; }
        .panel { width:100%; max-width:1180px; display:grid; grid-template-columns:1.1fr 0.9fr; gap:24px; align-items:center; }
        .glass-card { background:rgba(10,18,35,0.86); border:1px solid rgba(255,255,255,0.12); border-radius:28px; backdrop-filter:blur(16px); box-shadow:0 32px 80px rgba(0,0,0,0.35); overflow:hidden; }
        .glass-card .card-body { padding:36px; }
        .hero-badge { display:inline-flex; align-items:center; gap:10px; padding:10px 16px; border-radius:999px; border:1px solid rgba(0,212,255,0.22); background:rgba(0,212,255,0.08); color:#00d4ff; margin-bottom:20px; }
        .input-wrap { position:relative; margin-bottom:22px; }
        .input-wrap .form-control, .input-wrap textarea { width:100%; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.14); color:#eef3ff; border-radius:16px; padding:18px 18px 18px 52px; height:56px; transition: all .25s ease; }
        .input-wrap textarea { min-height:130px; resize:vertical; padding-top:18px; }
        .input-wrap .form-control:focus, .input-wrap textarea:focus { border-color:#00d4ff; box-shadow:0 0 20px rgba(0,212,255,0.18); }
        .input-icon { position:absolute; left:16px; top:50%; transform:translateY(-50%); color:#6edaff; font-size:1.2rem; }
        .form-label { position:absolute; left:52px; top:12px; color:rgba(255,255,255,0.65); font-size:0.95rem; pointer-events:none; transition: transform .25s ease, font-size .25s ease; }
        .form-control:focus + .form-label, .form-control:not(:placeholder-shown) + .form-label, textarea:focus + .form-label, textarea:not(:placeholder-shown) + .form-label { transform: translateY(-28px); font-size:0.82rem; color:#00d4ff; }
        .btn-primary { background:linear-gradient(135deg, #00d4ff, #8a2be2); border:none; border-radius:999px; padding:14px 30px; font-weight:700; box-shadow:0 18px 35px rgba(0,212,255,0.24); transition:transform .25s ease, box-shadow .25s ease; }
        .btn-primary:hover { transform:translateY(-2px) scale(1.01); box-shadow:0 24px 45px rgba(0,212,255,0.28); }
        .image-panel { background:linear-gradient(180deg, rgba(4,13,27,0.65), rgba(7,12,30,0.92)); border:1px solid rgba(255,255,255,0.1); border-radius:28px; padding:32px; display:flex; align-items:center; justify-content:center; min-height:520px; }
        .image-panel img { width:100%; max-width:520px; border-radius:24px; box-shadow:0 28px 80px rgba(0,0,0,0.35); }
        .helper-text { color:rgba(255,255,255,0.62); font-size:0.92rem; margin-top:-10px; margin-bottom:18px; }
        .back-link { display:inline-flex; align-items:center; gap:8px; color:#eef3ff; margin-bottom:20px; text-decoration:none; transition: color .25s ease; }
        .back-link:hover { color:#00d4ff; }
        .file-preview { margin-top:12px; color:rgba(255,255,255,0.72); font-size:0.95rem; }
        @media(max-width:960px) { .panel { grid-template-columns:1fr; } .image-panel { min-height:360px; } }
    </style>
</head>
<body>
    <div class="page-shell">
        <div class="panel d-flex justify-content-center">
            <div class="glass-card">
                <div class="card-body">
                    <div class="hero-badge"><i class="bi bi-kanban-fill"></i> Add Task</div>
                    <h2>Create a new priority task</h2>
                    <p>Use the smart form to add details, upload attachments, and keep your workflow polished.</p>
                    <a href="/user_dashboard" class="back-link"><i class="bi bi-arrow-left-short"></i>Back to Dashboard</a>
                    <form action="/add_task" method="POST" enctype="multipart/form-data">
                        <div class="input-wrap">
                            <i class="bi bi-card-heading input-icon"></i>
                            <input type="text" name="title" class="form-control" placeholder=" " required>
                            <label class="form-label">Task Title</label>
                        </div>
                        <div class="input-wrap">
                            <i class="bi bi-journal-text input-icon"></i>
                            <textarea name="description" class="form-control" placeholder=" " required></textarea>
                            <label class="form-label">Description</label>
                        </div>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <div class="input-wrap">
                                    <i class="bi bi-calendar3 input-icon"></i>
                                    <input type="date" name="due_date" class="form-control" placeholder=" " required>
                                    <label class="form-label">Due Date</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="input-wrap">
                                    <i class="bi bi-tags input-icon"></i>
                                    <input type="text" name="category" class="form-control" placeholder=" ">
                                    <label class="form-label">Category</label>
                                </div>
                                <div class="helper-text">Examples: Software, Server, Research, Design</div>
                            </div>
                        </div>
                        <div class="input-wrap">
                            <i class="bi bi-paperclip input-icon"></i>
                            <input type="file" name="file" id="taskFile" class="form-control" accept="image/*,.pdf,.doc,.docx">
                            <label class="form-label">Attachment</label>
                        </div>
                        <div id="filePreview" class="file-preview">No file selected.</div>
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary">Create Task</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script>
        const taskFile = document.getElementById('taskFile');
        const filePreview = document.getElementById('filePreview');
        taskFile?.addEventListener('change', function() {
            const file = this.files?.[0];
            filePreview.textContent = file ? 'Selected: ' + file.name : 'No file selected.';
        });
    </script>
</body>
</html>
