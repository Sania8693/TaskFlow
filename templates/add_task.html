<!DOCTYPE html>
<html>
<head>
    <title>Add Task</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #000;
            color: #fff;
        }
        .card {
            background-color: #111;
            border: 1px solid #fff;
        }
        input, textarea {
            background-color: #000 !important;
            color: #fff !important;
            border: 1px solid #fff !important;
        }
        .btn-custom {
            background-color: #fff;
            color: #000;
            font-weight: bold;
        }
        .btn-custom:hover {
            background-color: #ccc;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-black border-bottom border-light">
    <div class="container">
        <span class="navbar-brand fw-bold">ADD TASK</span>
        <a href="user_dashboard.html" class="btn btn-custom">Back</a>
    </div>
</nav>

<div class="container mt-5">
    <div class="card p-4 mx-auto" style="max-width:600px;">
        <h4 class="fw-bold mb-3 text-center">Create New Task</h4>

        <form>
            <div class="mb-3">
                <label>Task Title</label>
                <input type="text" class="form-control" placeholder="Enter task title">
            </div>

            <div class="mb-3">
                <label>Description</label>
                <textarea class="form-control" rows="4" placeholder="Enter task description"></textarea>
            </div>

            <div class="mb-3">
                <label>Due Date</label>
                <input type="date" class="form-control">
            </div>

            <button type="submit" class="btn btn-custom w-100">Create Task</button>
        </form>
    </div>
</div>

</body>
</html>
