<!DOCTYPE html>
<html lang="en">
<head>
    <title>Add Task</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #1a1a1a;
            color: #fff;
        }
        .card {
            background: #111;
            border: 1px solid #444;
        }
        .form-control, .form-select {
            background: #222;
            color: #fff;
            border: 1px solid #555;
        }
        .form-control:focus, .form-select:focus {
            border-color: #fff;
            box-shadow: none;
        }
        .btn-custom {
            background: #fff;
            color: #000;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container mt-5">
    <div class="mb-3">
        <a href="/user_dashboard" class="btn btn-outline-light">← Back to Dashboard</a>
    </div>
    <div class="card p-4 mx-auto" style="max-width: 600px;">
        <h3 class="text-center mb-4">Add Task</h3>

        <form action="/add_task" method="POST" enctype="multipart/form-data">

            <!-- Title -->
            <div class="mb-3">
                <label class="form-label">Task Title</label>
                <input type="text" name="title" class="form-control" required>
            </div>

            <!-- Description -->
            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea name="description" rows="3" class="form-control" required></textarea>
            </div>

            <!-- Row -->
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Due Date</label>
                    <input type="date" name="due_date" class="form-control" required>
                </div>

            </div>

            <!-- Status -->
            
            <!-- Category -->
            <div class="mb-3">
                <label class="form-label">Category</label>
                <input type="text" name="category" class="form-control" placeholder="Work, Personal...">
            </div>

            <!-- File Upload -->
            <div class="mb-3">
                <label class="form-label">Attachment</label>
                <input type="file" name="file" class="form-control">
            </div>

            <!-- Checkbox -->
            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" name="reminder">
                <label class="form-check-label">Set Reminder</label>
            </div>

            <!-- Submit -->
            <div class="d-grid">
                <button class="btn btn-custom">Create Task</button>
            </div>

        </form>
    </div>
</div>

</body>
</html>
