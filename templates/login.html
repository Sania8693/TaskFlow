<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * { font-family: 'Poppins', sans-serif; }
        body { margin:0; min-height:100vh; background:url('https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?ixlib=rb-4.0.3&auto=format&fit=crop&w=1650&q=80') center/cover no-repeat fixed; color:#eef3ff; }
        body::before { content:''; position:fixed; inset:0; background:rgba(4,10,26,0.82); z-index:0; }
        .auth-shell { position:relative; z-index:1; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:40px 20px; }
        .auth-panel { width:100%; max-width:1100px; display:grid; grid-template-columns:1fr 1fr; gap:24px; }
        .auth-card, .auth-visual { background:rgba(10,18,35,0.86); border:1px solid rgba(255,255,255,0.12); border-radius:28px; backdrop-filter:blur(18px); box-shadow:0 28px 80px rgba(0,0,0,0.34); overflow:hidden; }
        .auth-card { padding:40px; }
        .auth-card h2 { margin-bottom:18px; }
        .info-badge { display:inline-flex; align-items:center; gap:10px; padding:12px 18px; border-radius:999px; border:1px solid rgba(0,212,255,0.22); background:rgba(0,212,255,0.08); color:#00d4ff; margin-bottom:24px; }
        .input-wrap { position:relative; margin-bottom:22px; }
        .input-wrap input { width:100%; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.14); color:#eef3ff; border-radius:16px; padding:18px 18px 18px 52px; height:58px; transition:border-color .25s ease, box-shadow .25s ease; }
        .input-wrap input:focus { border-color:#00d4ff; box-shadow:0 0 18px rgba(0,212,255,0.18); }
        .input-icon { position:absolute; left:18px; top:50%; transform:translateY(-50%); color:#6edaff; font-size:1.2rem; }
        .toggle-btn { position:absolute; top:50%; right:16px; transform:translateY(-50%); border:none; background:none; color:#eef3ff; }
        .btn-auth { width:100%; background:linear-gradient(135deg,#00d4ff,#8a2be2); border:none; border-radius:999px; padding:14px 0; font-weight:700; box-shadow:0 18px 40px rgba(0,212,255,0.26); transition:transform .25s ease; }
        .btn-auth:hover { transform:translateY(-2px); }
        .auth-footer { margin-top:24px; color:rgba(255,255,255,0.72); }
        .auth-footer a { color:#00d4ff; }
        .auth-visual { padding:28px; display:flex; align-items:center; justify-content:center; }
        .auth-visual img { width:100%; max-width:420px; border-radius:24px; box-shadow:0 28px 70px rgba(0,0,0,0.3); }
        .alert-custom { background:rgba(255,75,75,0.16); color:#ffe8e8; border:1px solid rgba(255,75,75,0.25); }
        @media(max-width:992px) { .auth-panel { grid-template-columns:1fr; } .auth-visual { order:-1; } }
    </style>
</head>
<body>
    <div class="auth-shell">
        <div class="auth-panel d-flex justify-content-center">
            <div class="auth-card">
                <a href="/" class="navbar-brand fw-bold d-block text-center mb-3" style="background: linear-gradient(135deg, #00d4ff, #8a2be2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; font-size: 1.5rem; text-decoration: none;">SmartTask</a>
                <span class="info-badge"><i class="bi bi-lock-fill"></i> Secure sign in</span>
                <h2>Welcome back</h2>
                <p class="text-white-50 mb-4">Sign in to access your tasks, analytics, and dashboard features.</p>
                {% if error %}
                <div class="alert alert-danger alert-custom" role="alert">{{ error }}</div>
                {% endif %}
                <form method="POST">
                    <div class="input-wrap">
                        <i class="bi bi-envelope-fill input-icon"></i>
                        <input type="email" name="email" class="form-control" placeholder="Email address" required>
                    </div>
                    <div class="input-wrap">
                        <i class="bi bi-lock-fill input-icon"></i>
                        <input type="password" name="password" class="form-control password-input" placeholder="Password" required>
                        <button type="button" class="toggle-btn" onclick="togglePasswordVisibility(this)"><i class="bi bi-eye"></i></button>
                    </div>
                    <button type="submit" class="btn btn-auth">Login</button>
                </form>
                <p class="auth-footer">Don't have an account? <a href="/register">Register now</a></p>
            </div>
        </div>
    </div>
    <script>
        function togglePasswordVisibility(btn) {
            const input = document.querySelector('.password-input');
            const icon = btn.querySelector('i');
            if (input.type === 'password') { input.type = 'text'; icon.classList.replace('bi-eye','bi-eye-slash'); } else { input.type = 'password'; icon.classList.replace('bi-eye-slash','bi-eye'); }
        }
    </script>
</body>
</html>
