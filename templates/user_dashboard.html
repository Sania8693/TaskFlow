<!DOCTYPE html>
<html>
<head>
    <title>User Dashboard</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            background-color: #000;
            color: #fff;
        }
        .card {
            background-color: #111;
            border: 1px solid #fff;
        }
        table {
            color: #fff;
        }
        .btn-custom {
            background-color: #fff;
            color: #000;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-light py-3">
        <div class="container">
          <a class="navbar-brand fw-bold text-white" href="#">USER PANEL</a>
      
          <div>
            <a class="btn btn-outline-light me-2" href="/user_dashboard">Dashboard</a>
            <a class="btn btn-outline-light me-2" href="/add_task">Add Task</a>
            <a class="btn btn-outline-light me-2" href="/my_tasks">My Tasks</a>
            <a class="btn btn-light fw-bold" href="/">Logout</a>
          </div>
        </div>
      </nav>

<div class="container mt-4">

    <div class="row mb-4">
        <div class="col-md-4">
            <div class="card p-3 text-center text-white">
                <h5>Total Tasks</h5>
                <h2>{{total_tasks}}</h2>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card p-3 text-center text-white">
                <h5>Pending Tasks</h5>
                <h2>{{pending_tasks}}</h2>
                <h2>3</h2>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card p-3 text-center text-white">
                <h5><h2>{{ completed_tasks }}</h2></h5>
                <h2>1</h2>
            </div>
        </div>
    </div>
    <div class="card p-4 mt-4 mx-auto" style="max-width: 400px;">
        <h5 class="fw-bold text-center text-white">Task Status Overview</h5>
        <canvas id="statusChart"></canvas>
      </div>

    <div class="mb-3">
        <a href="/add_task" class="btn btn-custom">+ Add Task</a>
    </div>

    <table class="table table-dark table-bordered">
        <thead>
            <tr>
                <th>Title</th>
                <th>Priority</th>
                <th>Status</th>
                <th>Due Date</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Server Issue</td>
                <td>High</td>
                <td>Pending</td>
                <td>2026-02-25</td>
            </tr>
        </tbody>
    </table>

</div>
<script>
    const ctx = document.getElementById('statusChart');
    
    new Chart(ctx, {
        type: 'pie',
        data: {
            labels: ['Pending', 'In Progress', 'Completed'],
            datasets: [{
                data: [{ pending_tasks }, {inprogress_tasks}, { completed_tasks }],
                backgroundColor: ['#ffffff', '#888888', '#444444']
            }]
        },
        options: {
            plugins: {
                legend: {
                    labels: {
                        color: '#ffffff'
                    }
                }
            }
        }
    });
    </script>
</body>
</html>
