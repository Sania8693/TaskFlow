<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login Successful</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * { font-family: 'Poppins', sans-serif; }
        body { margin:0; min-height:100vh; background:url("{{ url_for('static', filename='img2.webp') }}") center/cover no-repeat fixed; color:#eef3ff; }
        body::before { content:''; position:fixed; inset:0; background:linear-gradient(180deg, rgba(4,10,25,0.88), rgba(16,24,48,0.95)); z-index:0; }
        .shell { position:relative; z-index:1; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:40px 20px; }
        .success-card { width:100%; max-width:640px; background:rgba(10,18,35,0.88); border:1px solid rgba(255,255,255,0.12); backdrop-filter:blur(20px); border-radius:28px; box-shadow:0 36px 100px rgba(0,0,0,0.35); overflow:hidden; animation:appear 0.8s ease both; }
        .success-card .card-body { padding:42px; text-align:center; }
        .success-badge { width:96px; height:96px; border-radius:50%; margin:0 auto 24px; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg, rgba(0,212,255,0.25), rgba(138,43,226,0.25)); box-shadow:0 24px 60px rgba(0,212,255,0.18); }
        .success-badge span { font-size:3rem; color:#f8fbff; }
        h1 { margin-bottom:16px; font-size:2.8rem; }
        .subtitle { color:rgba(255,255,255,0.74); margin-bottom:24px; }
        .info-panel { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.14); border-radius:22px; padding:24px; margin-bottom:28px; text-align:left; }
        .info-panel p { color:rgba(255,255,255,0.78); margin-bottom:8px; }
        .info-panel strong { color:#fff; }
        .btn-glow { background:linear-gradient(135deg,#00d4ff,#8a2be2); color:#fff; border:none; border-radius:999px; padding:14px 30px; box-shadow:0 18px 48px rgba(0,212,255,0.26); transition:transform .25s ease; }
        .btn-glow:hover { transform:translateY(-2px); }
        .secondary-link { display:inline-block; margin-top:16px; color:rgba(255,255,255,0.72); text-decoration:none; }
        .secondary-link:hover { color:#fff; }
        @keyframes appear { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:translateY(0); } }
    </style>
</head>
<body>
    <div class="shell">
        <div class="success-card">
            <div class="card-body">
                <div class="success-badge"><span>✓</span></div>
                <h1>Login successful</h1>
                <p class="subtitle">Welcome back, {{ username or 'User' }}. Your dashboard is ready with the latest insights.</p>
                <div class="info-panel">
                    <p><strong>Email:</strong> {{ email }}</p>
                    <p><strong>Login time:</strong> {{ login_time }}</p>
                </div>
                <a id="dashboardBtn" href="#" class="btn btn-glow">Go To Dashboard</a>
                <a href="/logout" class="secondary-link">Logout</a>
            </div>
        </div>
    </div>
    <script>
        const dashboardUrl = "{{ dashboard_route }}";
        document.getElementById('dashboardBtn').addEventListener('click', function(e) { e.preventDefault(); window.location.href = dashboardUrl; });
        history.pushState(null, null, window.location.href);
        window.addEventListener('popstate', ()=>window.location.href='/login');
    </script>
</body>
</html>
