<!DOCTYPE html>
<html>
<head>
    <title>Login Successful</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #33353c 0%, #342a3d 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .success-container {
            animation: slideIn 0.5s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .success-icon {
            animation: scaleIn 0.6s ease-out;
        }
        
        @keyframes scaleIn {
            from {
                transform: scale(0);
            }
            to {
                transform: scale(1);
            }
        }
        
        .btn-gradient {
            background: linear-gradient(135deg, #667eea 0%, #37323c 100%);
            color: white;
            border: none;
            transition: all 0.3s ease;
        }
        
        .btn-gradient:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
            color: white;
        }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card success-container shadow-lg p-5" style="max-width: 500px; border: none; border-radius: 15px;">
            <div class="success-icon d-flex justify-content-center align-items-center mx-auto mb-4" style="width: 80px; height: 80px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 50%;">
                <span style="color: white; font-size: 50px;">✓</span>
            </div>
            
            <h1 class="text-center text-dark mb-3 fs-1">Welcome Back!</h1>
            <div class="text-center mb-4" style="color: #667eea; font-size: 20px; font-weight: 500;">Hello, {{ username }}!</div>
            
            <p class="text-center text-muted mb-4">
                You have successfully logged in to your account. You now have access to all features.
            </p>
            
            <div class="bg-light p-4 rounded mb-4">
                <p class="text-muted mb-2"><strong>Email:</strong> {{ email }}</p>
                <p class="text-muted mb-0"><strong>Login Time:</strong> {{ login_time }}</p>
            </div>

                <div class="d-grid gap-2 justify-content-center">
    <a href="#" id="dashboardBtn" class="btn btn-gradient btn-lg">
        Go to Dashboard
    </a>
    <a href="/logout" class="btn btn-outline-secondary btn-sm">Logout</a>
</div>
        </div>
    </div>
    <script>
    // Store the dashboard URL from the server
    const dashboardUrl = "{{ dashboard_route }}";
    
    // Prevent going back to this page - redirect to login instead
    history.pushState(null, null, window.location.href);
    window.addEventListener('popstate', function() {
        window.location.href = "/login";
    });
    
    // Manual button click to go to dashboard
    document.getElementById('dashboardBtn').addEventListener('click', function(e) {
        e.preventDefault();
        window.location.href = dashboardUrl;
    });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
