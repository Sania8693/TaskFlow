<!DOCTYPE html>
<html>
<head>
    <title>Manage Users</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #000;
            color: #fff;
        }
        table {
            color: #fff;
        }
        .btn-custom {
            background-color: #fff;
            color: #000;
            font-weight: bold;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-black border-bottom border-light">
    <div class="container">
        <span class="navbar-brand fw-bold">MANAGE USERS</span>
        <a href="/admin_dashboard" class="btn btn-custom">Back</a>
    </div>
</nav>

<div class="container mt-4">

    <table class="table table-dark table-bordered">
        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            {% for user in users %}
            <tr>
                <td>{{ user[1] }}</td>
                <td>{{ user[2] }}</td>
                <td>
                    <span class="badge {% if user[3] == 'admin' %}bg-danger{% else %}bg-primary{% endif %}">
                        {{ user[3] }}
                    </span>
                </td>
                <td>
                    {% if user[3] != 'admin' %}
                        <a href="/delete_user/{{ user[0] }}" class="btn btn-danger btn-sm" onclick="return confirm('Are you sure you want to delete this user?')">Delete</a>
                    {% else %}
                        <span class="text-muted">Cannot delete admin</span>
                    {% endif %}
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</div>

</body>
</html>
