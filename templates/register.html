<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background-color: #000;
            color: #fff;
        }
        .card {
            background-color: #111;
            border: 1px solid #fff;
        }
        input {
            background-color: #000 !important;
            color: #fff !important;
            border: 1px solid #fff !important;
        }
        .password-toggle-group {
            position: relative;
            display: flex;
            align-items: center;
        }
        .password-toggle-btn {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 0;
            top: 50%;
            transform: translateY(-50%);
        }
        .password-toggle-btn:hover {
            color: #ccc;
        }
        .password-toggle-group input {
            padding-right: 40px !important;
        }

        .btn-custom {
            background-color: #fff;
            color: #000;
            font-weight: bold;
        }
        .btn-custom:hover {
            background-color: #ccc;
        }
    </style>
</head>
<body>

<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4" style="width: 400px;">
        <h3 class="text-center fw-bold mb-4 text-white">Register</h3>

        <form method="POST" action="/register">
            <div class="mb-3 text-white">
                <label for=""username>Full Name</label>
                <input type="text" name="username" class="form-control" placeholder="Enter your name" required>
            </div>

            <div class="mb-3 text-white">
                <label for="email">Email</label>
                <input type="email" name="email" class="form-control" placeholder="Enter email" required>
            </div>

             <div class="mb-3 text-white">
                <label for="password">Password</label>
                <div class="password-toggle-group">
                    <input type="password" name="password" class="form-control password-input" placeholder="Create password" required>
                    <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility(this)">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>


            <button type="submit" class="btn btn-custom w-100">Create Account</button>
        </form>

        <p class="text-center mt-3 text-white">
            Already have an account?
            <a href="/login" class="text-white fw-bold">Login</a>
        </p>
    </div>
</div>
<script>
    function togglePasswordVisibility(btn) {
        const input = btn.parentElement.querySelector('.password-input');
        const icon = btn.querySelector('i');
        
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.remove('bi-eye');
            icon.classList.add('bi-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.remove('bi-eye-slash');
            icon.classList.add('bi-eye');
        }
    }
</script>

</body>
</html>
