<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #000;
            color: #fff;

        table {

        .btn-custom {

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-light py-3">

          <div>
            <a class="btn btn-outline-light me-2" href="admin_dashboard.html">Dashboard</a>
