<!DOCTYPE html>
<html>
<head>
    <title>My Tasks</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #000;
            color: #fff;
        }
        table {
            color: #fff;
        }
        .btn-custom {
            background-color: #fff;
            color: #000;
            font-weight: bold;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-black border-bottom border-light">
    <div class="container">
        <span class="navbar-brand fw-bold">MY TASKS</span>
        <a href="/user_dashboard" class="btn btn-custom">Back</a>
    </div>
</nav>

<div class="container mt-4">

    <h2>My Tasks</h2>

    <table class="table table-dark table-bordered">
        <thead>
            <tr>
                <th>Title</th>
                <th>Description</th>
                <th>Priority</th>
                <th>Status</th>
                <th>Due Date</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            {% for task in tasks %}
            <tr>
                <td>{{ task[2] }}</td>
                <td>{{ task[3] }}</td>
                <td>
                    <span class="badge {% if task[5] == 'HIGH' %}bg-danger{% elif task[5] == 'MEDIUM' %}bg-warning{% else %}bg-secondary{% endif %}">
                        {{ task[5] }}
                    </span>
                </td>
                <td>
                    <span class="badge {% if task[4] == 'Completed' %}bg-success{% elif task[4] == 'In Progress' %}bg-primary{% else %}bg-warning{% endif %}">
                        {{ task[4] }}
                    </span>
                </td>
                <td>{{ task[6] }}</td>
                <td>
                    {% if task[4] == "Pending" %}
                        <a href="/start_task/{{ task[0] }}" class="btn btn-warning btn-sm">Start</a>
                    {% elif task[4] == "In Progress" %}
                        <a href="/complete_task/{{ task[0] }}" class="btn btn-success btn-sm">Complete</a>
                    {% else %}
                        <span class="text-success">✓ Completed</span>
                    {% endif %}
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

</body>
</html>
