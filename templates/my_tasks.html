<!DOCTYPE html>
<html>
<head>
    <title>My Tasks</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #000;
            color: #fff;
        }
        table {
            color: #fff;
        }
        .btn-custom {
            background-color: #fff;
            color: #000;
            font-weight: bold;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-black border-bottom border-light">
    <div class="container">
        <span class="navbar-brand fw-bold">MY TASKS</span>
        <a href="user_dashboard.html" class="btn btn-custom">Back</a>
    </div>
</nav>

<div class="container mt-4">

    <h2>My Tasks</h2>

    <table class="table table-dark table-bordered">
    
    <tr>
    <th>Title</th>
    <th>Description</th>
    <th>Status</th>
    <th>Action</th>
    </tr>
    
    {% for task in tasks %}
    
    <tr>
    <td>{{ task[1] }}</td>
    <td>{{ task[2] }}</td>
    <td>{{ task[4] }}</td>
    
    <td>
    
    {% if task[4] == "Pending" %}
    <a href="/start_task/{{ task[0] }}" class="btn btn-warning btn-sm">Start</a>
    
    {% elif task[4] == "In Progress" %}
    <a href="/complete_task/{{ task[0] }}" class="btn btn-success btn-sm">Complete</a>
    
    {% else %}
    Completed
    {% endif %}
    
    </td>
    
    </tr>
    
    {% endfor %}
    
    </table>
</div>

</body>
</html>
